<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần mềm Quản lý Nhân sự</title>
    <!-- Sử dụng Tailwind CSS để giao diện đẹp mắt và chuẩn trên điện thoại -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Quản Lý Nhân Sự</h1>

        <!-- Form thêm nhân viên -->
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Họ và tên</label>
                <input type="text" id="empName" placeholder="Nhập tên nhân viên..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phòng ban</label>
                <input type="text" id="empDept" placeholder="Nhập phòng ban..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button onclick="addEmployee()" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">Thêm Nhân Viên</button>
        </div>

        <hr class="mb-6">

        <!-- Danh sách nhân viên -->
        <div>
            <h2 class="text-lg font-semibold text-gray-700 mb-3">Danh sách hiện tại</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3 border-b">Họ tên</th>
                            <th class="p-3 border-b">Phòng ban</th>
                            <th class="p-3 border-b text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="empTableBody">
                        <!-- Dữ liệu sẽ được thêm vào đây tự động -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Lấy dữ liệu từ bộ nhớ điện thoại (localStorage) nếu có
        let employees = JSON.parse(localStorage.getItem('employees')) || [];

        function renderTable() {
            const tbody = document.getElementById('empTableBody');
            tbody.innerHTML = '';

            if (employees.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">Chưa có nhân viên nào.</td></tr>`;
                return;
            }

            employees.forEach((emp, index) => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50 text-sm">
                        <td class="p-3 text-gray-800 font-medium">${emp.name}</td>
                        <td class="p-3 text-gray-600">${emp.dept}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteEmployee(${index})" class="text-red-500 hover:text-red-700 font-medium">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        function addEmployee() {
            const nameInput = document.getElementById('empName');
            const deptInput = document.getElementById('empDept');
            
            const name = nameInput.value.trim();
            const dept = deptInput.value.trim();

            if (!name || !dept) {
                alert('Vui lòng nhập đầy đủ thông tin!');
                return;
            }

            employees.push({ name, dept });
            localStorage.setItem('employees', JSON.stringify(employees));

            nameInput.value = '';
            deptInput.value = '';
            renderTable();
        }

        function deleteEmployee(index) {
            employees.splice(index, 1);
            localStorage.setItem('employees', JSON.stringify(employees));
            renderTable();
        }

        // Chạy lần đầu khi mở trang
        renderTable();
    </script>
</body>
</html>
